<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuizForge | Online Quiz System</title><link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar"><a class="brand" href="/">QuizForge</a><span id="userLabel">Not signed in</span></header>
<main class="container">
  <section id="authPanel" class="panel">
    <h1>Welcome to QuizForge</h1><p class="muted">Sign in or create a student account to begin.</p>
    <div class="tabs"><button data-mode="login" class="active">Sign in</button><button data-mode="register">Register</button></div>
    <form id="authForm">
      <label id="nameWrap" class="hidden">Full name<input name="name" maxlength="100"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" minlength="8" required autocomplete="current-password"></label>
      <button class="primary" type="submit" id="authSubmit">Sign in</button>
    </form><p id="authMessage" class="message"></p>
  </section>
  <section id="appPanel" class="hidden">
    <div class="welcome"><div><h1 id="heading">Available quizzes</h1><p class="muted" id="subheading">Choose a quiz to get started.</p></div><button id="logoutBtn" class="secondary">Sign out</button></div>
    <div id="adminPanel" class="panel hidden">
      <h2>Create a quiz</h2>
      <form id="quizForm" class="form-grid">
        <label>Quiz title<input name="title" required maxlength="180"></label>
        <label>Duration (minutes)<input name="duration_minutes" type="number" min="1" max="240" value="15" required></label>
        <label class="wide">Description<textarea name="description" rows="2"></textarea></label>
        <button class="primary" type="submit">Create draft</button>
      </form>
      <p id="adminMessage" class="message"></p>
      <div id="questionEditor" class="hidden">
        <h3 id="draftTitle"></h3>
        <form id="questionForm">
          <label>Question<textarea name="question_text" required rows="2"></textarea></label>
          <label>Points<input name="points" type="number" min="0.1" step="0.1" value="1"></label>
          <div class="option-grid">
            <label>Option A<input name="option1" required></label><label>Option B<input name="option2" required></label>
            <label>Option C<input name="option3"></label><label>Option D<input name="option4"></label>
          </div>
          <label>Correct option<select name="correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label>
          <button class="primary">Add question</button>
        </form>
        <button id="publishBtn" class="secondary">Publish quiz</button>
      </div>
    </div>
    <div id="quizList" class="quiz-grid"></div>
    <section id="quizStage" class="panel hidden"></section>
    <section id="resultStage" class="panel hidden"></section>
  </section>
</main>
<script src="/app.js"></script>
</body></html>
